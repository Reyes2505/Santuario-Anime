name: Bot Ectosimbionte - Sincronización

on:
  schedule:
    - cron: '30 15 * * *'   # 10:30 AM Perú (UTC-5)
    - cron: '0 19 * * *'    # 2:00 PM Perú (UTC-5)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests beautifulsoup4 supabase
      
      - name: Run bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python bot_jkanime.py
